[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"]
allow_paths = ["../node_modules"]
fs_permissions = [{ access = "read", path = "../circuits/results" }]
