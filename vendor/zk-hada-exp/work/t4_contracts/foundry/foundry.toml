[profile.default]
src = "src"
out = "out"
libs = ["lib"]
allow_paths = ["../node_modules"]
remappings = ["zk-kit-lean-imt/=lib/zk-kit-lean-imt/", "poseidon-solidity/=../node_modules/poseidon-solidity/"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./test" }]
